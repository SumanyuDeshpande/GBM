[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-local"
version = "1.7.0"
description = "Automatic local project checkpoints and recovery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
gbm = "gbm.cli:main"

[tool.setuptools.packages.find]
include = ["gbm*"]

[project.urls]
Homepage = "https://github.com/SumanyuDeshpande/GBM"
Repository = "https://github.com/SumanyuDeshpande/GBM"
Issues = "https://github.com/SumanyuDeshpande/GBM/issues"
